name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24.15.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate compatibility fixture catalog
        if: matrix.node == '22.22.3'
        run: npm run test:fixtures
      - run: npm run check
      - run: npm audit --audit-level=low
      - name: Build and audit maintained documentation
        if: matrix.node == '22.22.3'
        run: |
          npm run docs:install:angular-22
          npm run build:docs:angular-22
          npm run audit:docs

  release-artifact:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run build-package
      - run: npm run pack:check
      - name: Create package archive
        run: |
          mkdir -p release
          npm pack ./dist/@stackline/angular-multiselect-dropdown --ignore-scripts --pack-destination release
          (cd release && sha512sum *.tgz > SHA512SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stackline-angular-multiselect-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
